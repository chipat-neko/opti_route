name: Deploy site web (Flutter Web -> GitHub Pages)

# Declenchement :
# - Push sur main : auto a chaque merge (PR mergee, hotfix direct,...).
# - workflow_dispatch : bouton "Run workflow" dans l'onglet Actions
#   pour relancer manuellement sans rien pusher.
# Note YAML : "on" est quote pour eviter qu'il soit parse comme le
# booleen `True` (norme YAML 1.1) par certains outils de validation.
"on":
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'site_doc/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Permissions necessaires pour publier sur GitHub Pages via Actions :
# - pages: write     -> ecrire le deploiement
# - id-token: write  -> requis par actions/deploy-pages@v4 (OIDC)
# - contents: read   -> checkout du repo
permissions:
  pages: write
  id-token: write
  contents: read

# Empeche deux deploiements concurrents : si un nouveau push arrive
# pendant qu'un deploy tourne, on laisse le 1er finir et on enchaine.
# Ne PAS cancel-in-progress sinon GitHub Pages peut se retrouver
# dans un etat instable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 : compile l'app Flutter en JS via `flutter build web` et
  # upload le resultat comme artifact GitHub Pages.
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    # Timeout de securite : un build Flutter Web ne devrait jamais
    # depasser ~10 min. Si on atteint 15, c'est qu'un truc est coince
    # (cache foireux, action tierce qui hang) -> on coupe.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # aligne sur ci.yml (bumper les 3 fichiers ensemble)
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Regenere le code Drift (.g.dart) avant le build : evite qu'un
      # .g.dart committe desynchronise du schema casse `flutter build web`
      # (le build ne regenere pas tout seul le code genere).
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      # Confidentialite (RGPD) : les fixtures OCR (assets/test_bordereaux/,
      # ~24 MB) sont des scans de bordereaux clients REELS (noms, adresses,
      # telephones). Elles ne servent qu'au batch eval integration_test.
      # Sans ce strip, `flutter build web` les bundle dans l'app publiee sur
      # GitHub Pages -> telechargeables par URL directe
      # (…/opti_route/assets/assets/test_bordereaux/page_01.jpg). On les
      # retire du pubspec avant le build (idem scripts/build-and-install.ps1
      # pour l'APK). Il n'y a qu'une ligne `- assets/test_bordereaux/` a
      # supprimer, le pattern est donc sans risque de sur-suppression.
      - name: Strip test fixtures from pubspec (privacy)
        run: sed -i '/test_bordereaux/d' pubspec.yaml

      # base-href "/opti_route/" : le site sera servi sous le
      # sous-chemin du nom du repo, donc tous les paths absolus
      # (assets, canvaskit, main.dart.js) doivent commencer par
      # /opti_route/.
      # --source-maps : permet de decoder le stack trace minifie quand
      # un user envoie un screen d'erreur (sans ca on a juste
      # main.dart.js:156366 = inutile). Cout : ~3-5 MB de .map upload.
      # Acceptable pour un MVP en debug actif.
      #
      # --dart-define SUPABASE_* : injecte les credentials cloud pour que
      # la version web se connecte au cloud (identique a l'APK/MSIX).
      # La cle ANON est PUBLIQUE par design (deja distribuee dans l'APK),
      # donc la stocker en secret GitHub n'expose rien de sensible. On
      # NE met PAS la cle Gemini sur le web (cote serveur uniquement).
      # Si les secrets sont absents, le build reste valide en mode
      # local-only (defaultValue '' dans SupabaseService).
      - name: Build web (release + source maps + cloud)
        run: |
          flutter build web --release --source-maps --base-href "/opti_route/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      # Copie le site vitrine statique (site_doc/) dans un sous-dossier
      # `site/` du build Flutter Web, pour qu'il soit accessible a
      # `https://chipat-neko.github.io/opti_route/site/` parallelement
      # a l'app Flutter elle-meme (servie a la racine `/opti_route/`).
      #
      # Le site vitrine est en HTML/CSS/JS statique : aucun build, juste
      # une copie. Les liens internes sont en chemins relatifs (ex:
      # `<a href="features.html">`), donc ils fonctionneront tels quels
      # depuis le sous-chemin.
      - name: Copy site_doc into build output
        working-directory: .
        run: |
          mkdir -p app/build/web/site
          cp -r site_doc/* app/build/web/site/
          # Audit A6 #238 : investisseurs.html contient des donnees
          # confidentielles (projections financieres + email perso). Le
          # `noindex` n'empeche pas l'acces par lien direct -> on ne le
          # publie PAS. Le fichier reste dans le repo pour usage local
          # (pitch investisseur hors ligne).
          rm -f app/build/web/site/investisseurs.html

      # Setup Pages : prepare la configuration GitHub Pages (cree
      # l'environnement si premiere fois, recupere l'URL de deploy).
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload le contenu de build/web/ comme artifact dedie Pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  # ────────────────────────────────────────────────────────────────
  # Job 2 : deploie l'artifact upload par le job build sur le site
  # GitHub Pages du repo (https://chipat-neko.github.io/opti_route/).
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
