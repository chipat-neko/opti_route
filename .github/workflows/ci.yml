# F14 — Actions tierces EPINGLEES par SHA de commit.
# Un tag flottant (`@v4`) est mutable : le proprietaire de l'action peut le
# repointer sur n'importe quel commit, qui s'executerait alors dans le job
# (ici : aucun secret expose, mais le GITHUB_TOKEN et la main sur le code
# teste et build). Un SHA, lui, est immuable.
# Le `# vX.Y.Z` en bout de ligne n'est qu'une aide de lecture : c'est le SHA
# qui fait foi. Dependabot (.github/dependabot.yml, ecosysteme
# "github-actions") ouvre chaque semaine la PR qui bumpe SHA + commentaire.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Aligne EXACTEMENT sur l'environnement de Noah (Flutter local
          # 3.41.9). Sans version pinnee, `channel: stable` prenait le
          # dernier stable (plus recent) -> faux positifs d'analyze sur des
          # API depreciees apres 3.41 (ex: ReorderableListView.onReorder)
          # alors que le build de Noah est OK. La CI doit tester ce qu'on
          # livre, pas une version future.
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # sqlite3 3.x charge sa lib native via les "native assets" (hooks).
      # Sans ce flag, `flutter test` echoue a ouvrir la base sur le runner.
      - name: Active native assets
        run: flutter config --enable-native-assets

      - name: flutter pub get
        run: flutter pub get

      # On regenere les fichiers Drift au cas où ils auraient drifte
      # par rapport au schema check-in. Si build_runner echoue, on veut
      # le savoir avant le analyze.
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      # --coverage genere coverage/lcov.info (audit 2026-06-11). On
      # publie le fichier en artifact pour pouvoir suivre la tendance
      # (et brancher Codecov plus tard si besoin) sans bloquer la PR.
      - name: flutter test
        run: flutter test --coverage --reporter expanded

      # F16 — resume de couverture dans le recap du job (onglet Summary).
      # Parse le lcov : LF = lignes trouvables, LH = lignes couvertes.
      # Best-effort : ne fait JAMAIS echouer le job (if: always + garde
      # sur l'absence du fichier).
      - name: Coverage summary
        if: always()
        run: |
          f=coverage/lcov.info
          if [ -f "$f" ]; then
            read lh lf <<< "$(awk -F: '/^LH:/{h+=$2} /^LF:/{t+=$2} END{print h+0, t+0}' "$f")"
            if [ "${lf:-0}" -gt 0 ]; then
              pct=$(awk "BEGIN{printf \"%.1f\", ${lh:-0}*100/${lf:-0}}")
            else
              pct="n/a"
            fi
            {
              echo "## Couverture de tests"
              echo ""
              echo "**${lh:-0} / ${lf:-0} lignes couvertes** (${pct} %)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lcov.info absent — pas de resume de couverture." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # Edge Functions Supabase : tests Deno des unites pures extraites
  # dans les lib.ts (audit 2026-06-11). Rapide (<10 s), pas de reseau
  # ni de stack Supabase locale : on teste la validation, les gardes
  # de securite (timing-safe, email match), le CORS et le parsing.
  # ────────────────────────────────────────────────────────────────
  edge-functions:
    name: deno test (Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: deno test
        run: deno test supabase/functions/_tests/

  # ────────────────────────────────────────────────────────────────
  # F13 — Build web en PR uniquement : detecte une casse du build
  # Flutter Web des la PR (deploy-web.yml, lui, ne tourne que sur push
  # main -> une regression web n'etait vue qu'apres merge). Pas de
  # deploy ni d'upload Pages ici, juste `flutter build web`.
  # ────────────────────────────────────────────────────────────────
  build-web:
    name: build web (verif PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # aligne sur ci.yml/deploy-web/build-windows (bumper les 3 fichiers ensemble)
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Regenere le code Drift (.g.dart) : sinon `flutter build` compile le
      # .g.dart committe tel quel et casse s'il est desynchronise du schema
      # (cf le job flutter qui, lui, regenere avant analyze/test).
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      # Confidentialite (RGPD) : voir deploy-web.yml. On retire les
      # fixtures OCR (scans clients reels) du pubspec avant le build.
      - name: Strip test fixtures from pubspec (privacy)
        run: sed -i '/test_bordereaux/d' pubspec.yaml

      - name: flutter build web (release, sans deploy)
        run: flutter build web --release
