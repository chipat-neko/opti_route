name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Aligne EXACTEMENT sur l'environnement de Noah (Flutter local
          # 3.41.9). Sans version pinnee, `channel: stable` prenait le
          # dernier stable (plus recent) -> faux positifs d'analyze sur des
          # API depreciees apres 3.41 (ex: ReorderableListView.onReorder)
          # alors que le build de Noah est OK. La CI doit tester ce qu'on
          # livre, pas une version future.
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # sqlite3 3.x charge sa lib native via les "native assets" (hooks).
      # Sans ce flag, `flutter test` echoue a ouvrir la base sur le runner.
      - name: Active native assets
        run: flutter config --enable-native-assets

      - name: flutter pub get
        run: flutter pub get

      # On regenere les fichiers Drift au cas où ils auraient drifte
      # par rapport au schema check-in. Si build_runner echoue, on veut
      # le savoir avant le analyze.
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      # --coverage genere coverage/lcov.info (audit 2026-06-11). On
      # publie le fichier en artifact pour pouvoir suivre la tendance
      # (et brancher Codecov plus tard si besoin) sans bloquer la PR.
      - name: flutter test
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # Edge Functions Supabase : tests Deno des unites pures extraites
  # dans les lib.ts (audit 2026-06-11). Rapide (<10 s), pas de reseau
  # ni de stack Supabase locale : on teste la validation, les gardes
  # de securite (timing-safe, email match), le CORS et le parsing.
  # ────────────────────────────────────────────────────────────────
  edge-functions:
    name: deno test (Edge Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno test
        run: deno test supabase/functions/_tests/
