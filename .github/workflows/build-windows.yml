name: Build Windows (.exe) → artifact

# Build l'app Flutter pour Windows et upload un ZIP téléchargeable
# depuis la page Actions. Noah dézippe et remplace son exe sur le bureau.
#
# Déclenchement :
# - Push sur main : auto à chaque merge (PR mergée).
# - workflow_dispatch : bouton "Run workflow" pour relancer à la
#   demande sans rien pusher.
"on":
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

# Si plusieurs push s'enchaînent rapidement, on garde le plus récent
# et on annule les builds en cours (économise les minutes Actions
# Windows qui sont plus coûteuses).
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows release
    # On ÉPINGLE l'image sur windows-2022 (VS 2022 / MSVC 14.4x / CMake 3.x)
    # au lieu de windows-latest : ce dernier est passé sur un toolchain de
    # préversion (VS 18 / MSVC 14.51 / CMake 4.x) qui casse le build (voir les
    # deux env ci-dessous). Pour un artefact de release distribué, un toolchain
    # figé et reproductible vaut mieux que le bleeding-edge. (Réévaluer quand les
    # plugins auront rattrapé le nouveau MSVC ; windows-2022 reste supporté.)
    runs-on: windows-2022
    # Build Windows Flutter prend ~8-12 min. Timeout 20 min pour
    # absorber un setup Flutter long ou un cache miss.
    timeout-minutes: 20
    # Garde-fou défensif (inoffensif sur windows-2022 dont CMake est en 3.x,
    # utile si l'image venait à passer en CMake >=4.0) : CMAKE_POLICY_VERSION_MINIMUM
    # rétablit la policy min du sous-build pdfium (plugin pdfx, via DownloadProject
    # → execute_process). Lu depuis l'ENV et hérité par le cmake enfant (un flag -D
    # ne s'y propagerait pas). Cf. release notes CMake 4.0.
    #
    # NB : on N'injecte PAS de var d'env `CL` (ex. pour silencer STL1011 sur
    # <experimental/coroutine>) : d'une part le MSVC 14.4x de windows-2022 ne
    # transforme pas cette dépréciation en erreur (contrairement au 14.51 de
    # windows-latest), d'autre part `CL` fait échouer la détection du compilateur
    # par CMake (« No CMAKE_CXX_COMPILER could be found »).
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    defaults:
      run:
        working-directory: app
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # aligne sur ci.yml (bumper les 3 fichiers ensemble)
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: flutter pub get
        run: flutter pub get

      # Regenere le code Drift (.g.dart) avant le build : evite qu'un
      # .g.dart committe desynchronise du schema casse `flutter build windows`
      # (le build ne regenere pas tout seul le code genere).
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      # Confidentialité (RGPD) : voir deploy-web.yml. Les fixtures OCR
      # (assets/test_bordereaux/, ~24 MB de scans de bordereaux clients
      # RÉELS) ne servent qu'au batch eval. Sans ce strip, l'exe/MSIX
      # Windows distribué les embarque. On les retire du pubspec avant le
      # build (idem APK). Le job tourne en `shell: bash` (Git Bash), donc
      # `sed` est disponible sur le runner windows-latest.
      - name: Strip test fixtures from pubspec (privacy)
        run: sed -i '/test_bordereaux/d' pubspec.yaml

      # Inject le cloud.env.json depuis un GitHub Secret si défini.
      # Sans secret, on builde en mode local-only (la section "Sync
      # cloud" affichera "non disponible" mais l'app marche).
      - name: Write cloud.env.json from secret
        if: ${{ env.CLOUD_ENV_JSON != '' }}
        env:
          CLOUD_ENV_JSON: ${{ secrets.CLOUD_ENV_JSON }}
        run: |
          if [ -n "$CLOUD_ENV_JSON" ]; then
            echo "$CLOUD_ENV_JSON" > cloud.env.json
            echo "cloud.env.json injected (length: ${#CLOUD_ENV_JSON})"
          else
            echo "{}" > cloud.env.json
            echo "No CLOUD_ENV_JSON secret -> empty config (local-only mode)"
          fi

      - name: Build windows release
        run: |
          if [ -f cloud.env.json ]; then
            flutter build windows --release --dart-define-from-file=cloud.env.json
          else
            flutter build windows --release
          fi

      # Le binaire + ses DLL sortent dans build/windows/x64/runner/Release/.
      # On zippe tout le dossier Release/ pour que Noah ait l'exe + ses
      # dépendances natives au même endroit.
      - name: Package Release folder into ZIP
        working-directory: app/build/windows/x64/runner
        shell: pwsh
        run: |
          Compress-Archive -Path Release\* -DestinationPath opti_route-windows.zip -Force
          Get-ChildItem opti_route-windows.zip | Format-List Length,FullName

      # Cleanup cloud.env.json avant que les artifacts ne capturent
      # quoi que ce soit (le ZIP ne le contient pas car c'est compilé
      # dans le binaire via dart-define, mais on supprime par sécurité).
      - name: Cleanup secret file
        if: always()
        run: rm -f cloud.env.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opti_route-windows-${{ github.sha }}
          path: app/build/windows/x64/runner/opti_route-windows.zip
          # 14 jours suffisent : Noah download dans la journée du merge.
          # Plus long = on garde des vieilles versions pour rien.
          retention-days: 14
