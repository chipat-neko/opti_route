# F2 — Chemin de build de l'AAB Play Store, sur declenchement manuel.
#
# Pourquoi ce workflow : l'AAB etait jusqu'ici produit uniquement a la main
# sur le PC de Noah. Rien ne garantissait alors que les fixtures OCR
# (assets/test_bordereaux/ = scans de bordereaux clients REELS) avaient bien
# ete retirees du pubspec avant le build, alors que les chemins web/Windows,
# eux, strippent depuis #501. Un AAB non strippe publie sur le Play Store
# distribue des donnees personnelles a tous les installateurs.
#
# Ce workflow refait le chemin complet ET verifie l'absence de fixtures dans
# l'AAB produit (le build echoue si le strip a rate).
#
# Actions epinglees par SHA : cf l'entete de ci.yml.
name: Build Android (AAB)

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Retention de l'artefact (jours)"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    name: build appbundle (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # JDK epingle : leçon du build Windows casse par la derive du runner
      # (cf #519). On ne laisse pas l'image decider de la version de Java.
      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # aligne sur ci.yml/deploy-web/build-windows (bumper les 4 fichiers ensemble)
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Regenere le code Drift : le .g.dart committe peut etre desynchronise
      # du schema (cf le meme step dans build-web / deploy-web).
      - name: dart run build_runner build
        run: dart run build_runner build --delete-conflicting-outputs

      # Confidentialite (RGPD) : voir deploy-web.yml. Il n'y a qu'une ligne
      # `- assets/test_bordereaux/` a retirer, le pattern est sans risque de
      # sur-suppression. La verification post-build ci-dessous fait foi.
      - name: Strip test fixtures from pubspec (privacy)
        run: sed -i '/test_bordereaux/d' pubspec.yaml

      # Signature release, seulement si les 4 secrets sont configures :
      #   ANDROID_KEYSTORE_BASE64  (base64 du .jks : `base64 -w0 upload-keystore.jks`)
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
      # Les fichiers sont ecrits dans RUNNER_TEMP, JAMAIS dans l'arbre du repo,
      # et supprimes en fin de job. build.gradle.kts lit le chemin via
      # $OPTIROUTE_KEY_PROPERTIES (cf docs/keystore-release.md).
      # Sans secrets, le build retombe sur les cles debug : l'AAB reste
      # utilisable pour tester, mais n'est pas publiable.
      - name: Restore release keystore from secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents -> AAB signe avec les cles debug, NON publiable."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/upload-keystore.jks"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=upload-keystore.jks"
          } > "$RUNNER_TEMP/keystore/key.properties"
          chmod 600 "$RUNNER_TEMP/keystore/key.properties"
          echo "OPTIROUTE_KEY_PROPERTIES=$RUNNER_TEMP/keystore/key.properties" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # --dart-define SUPABASE_* : injecte les credentials cloud (idem
      # deploy-web.yml). Sans secrets, l'app builde en mode local-only.
      - name: flutter build appbundle (release)
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      # Garde-fou : c'est CE step qui garantit la promesse du workflow.
      # Un AAB contenant des scans clients ne doit jamais quitter le runner.
      - name: Verify no client fixtures in the AAB
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -q test_bordereaux; then
            echo "::error::L'AAB contient des fixtures test_bordereaux (scans clients). Build rejete."
            unzip -l "$AAB" | grep test_bordereaux | head -20
            exit 1
          fi
          echo "OK : aucune fixture test_bordereaux dans l'AAB."

      # Le keystore ne doit survivre ni au job, ni a un artefact.
      - name: Cleanup keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            opti_route-${{ steps.keystore.outputs.signed == 'true' && 'release' || 'debugsigned' }}-${{ github.sha }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: ${{ inputs.keep_days }}
          if-no-files-found: error

      - name: Resume
        if: always()
        run: |
          {
            echo "### Build Android (AAB)"
            echo ""
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "- Signature : **upload key** (secrets presents) -> publiable sur la Play Console."
            else
              echo "- Signature : **cles debug** (secrets absents) -> **NON publiable**, test uniquement."
            fi
            echo "- Fixtures clients : strippees du pubspec + absence verifiee dans l'AAB."
            echo "- Flutter : 3.41.9 / JDK 17 (temurin)."
          } >> "$GITHUB_STEP_SUMMARY"
