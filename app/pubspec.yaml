name: opti_route
description: "Optimisation de tournees de livraison multi-points"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
#
# SOURCE DE VERITE du versionCode = le build-number ci-dessous. NE PAS
# builder avec --build-number en ligne de commande : ca override cette
# valeur et recree des faux downgrades (INSTALL_FAILED_VERSION_DOWNGRADE).
# Regle : bumper ce nombre a chaque build distribue, et garder
# msix_version aligne. Dernier versionCode distribue avant cette regle :
# 10070 (build local output-metadata) / 10069 (device Noah).
version: 2.9.3+10071

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  google_fonts: ^8.1.0
  http: ^1.6.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.2
  url_launcher: ^6.3.1
  # Lecture de la version installée pour le check d'update (#update_checker).
  package_info_plus: ^9.0.1
  geolocator: ^14.0.0
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  pdf: ^3.11.4
  pdfx: ^2.9.1
  file_picker: ^11.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  local_auth: ^3.0.0
  local_auth_android: ^2.0.0
  crypto: ^3.0.5
  # Package `image` pour manipuler les pixels (rotations 90/180/270)
  # lors du re-OCR en cas de bordereau scanne dans le mauvais sens.
  # Pas de plugin natif : 100 % Dart, marche aussi en web.
  image: ^4.5.4
  # Connectivity_plus : observe les changements wifi/mobile/none pour
  # declencher automatiquement le re-geocodage des arrets ajoutes en
  # mode hors-ligne (cf OfflineGeocodeAutomation).
  connectivity_plus: ^7.1.0
  # battery_plus : niveau + etat (charge/decharge) de la batterie pour
  # l'alerte "batterie faible" en tournee (carte #258). Gratuit, on-device,
  # pas de cle. Sert aussi a l'indicateur batterie de l'en-tete tournee.
  battery_plus: ^6.2.1
  # Archive : creation / lecture de zip pour le backup complet
  # (DB SQLite + photos preuves) en un seul fichier partageable.
  archive: ^4.0.7
  # flutter_tts : synthese vocale on-device pour les instructions de
  # navigation ("Tournez a droite dans 200 metres") dans le mode
  # "Suivre dans l'app". Voix systeme Android (gratuite). Etape 3 du
  # plan GPS turn-by-turn integre.
  flutter_tts: ^4.2.0
  # supabase_flutter : Phase 2 backend cloud (auth + sync chef-equipiers).
  # Pour ce jalon 1, seule l'auth email OTP est activee. Free tier UE
  # (Frankfurt/Paris), 500 MB DB, 50k MAUs -- largement assez pour
  # commencer.
  supabase_flutter: ^2.12.0
  # flutter_secure_storage : stockage chiffre (Keystore Android / Keychain
  # iOS) de la session Supabase (refresh_token). Sans lui, le SDK retombe
  # sur SharedPreferences en clair -> token long-lived volable sur device
  # roote/vole (audit #179). Branche via un LocalStorage custom dans
  # SupabaseService.init.
  flutter_secure_storage: ^10.3.1
  # uuid : generation cote app de UUIDs v4 servant de cle primaire dans
  # le schema cloud Supabase (sous-jalon 2.B). Indispensable pour
  # generer l'id LOCALEMENT avant l'INSERT cloud, puis le persister
  # dans la colonne `cloud_id` Drift -- ca rend le re-push idempotent
  # et permet a 2 phones de generer en parallele sans collision.
  uuid: ^4.5.1
  # receive_sharing_intent : intercepte les partages Android (ACTION_SEND
  # text/plain) pour quand l'utilisateur fait "Partager -> opti_route"
  # depuis Google Maps app, SMS, mail, etc. On parse le texte recu pour
  # ajouter directement un arret a une tournee.
  # v1.8.0 (mai 2024) : Kotlin compile en JVM 17 (compatible avec
  # notre app), pas JVM 21 comme la v1.8.1+ qui casse la build avec
  # 'Inconsistent JVM-target compatibility'.
  receive_sharing_intent: 1.8.0
  # speech_to_text : reconnaissance vocale on-device pour ajouter
  # une adresse a la voix en cours de tournee (mains libres au volant,
  # style Spoke route planner). Utilise le moteur Google Speech sur
  # Android (gratuit, on-device). Pas de cle API, pas de cout.
  # Permissions iOS/Android auto-declarees par le plugin.
  speech_to_text: ^7.3.0
  # mobile_scanner : caméra live + détection automatique des codes-barres
  # 1D (Code128, EAN13, CODE39 utilisés par MESEXP/Colissimo/Chronopost)
  # et 2D (QR, DataMatrix). Plus fluide que photo + ML Kit car analyse
  # le flux vidéo en continu. Workflow Noah : scanner les étiquettes
  # colis pour ajouter directement à la tournée (matching automatique
  # si plusieurs colis pour le même client via numéro de tracking).
  # Pas de cle API ni cout. ~2 MB overhead APK.
  mobile_scanner: ^7.0.0
  # tutorial_coach_mark : info-bulles guidees au 1er lancement de chaque
  # ecran complexe (tournee_du_jour, scan, parametres, carnet). Pas de
  # serveur ni cle, 100% local. Flag `coach_*_done` par ecran dans
  # ParametresRepository pour ne plus re-afficher apres validation.
  # Reset via Parametres > Aide > Reactiver les astuces.
  tutorial_coach_mark: ^1.2.11
  # wakelock_plus : garde l'ecran allume pendant la navigation GPS
  # "Suivre dans l'app" (NavigationScreen). Sans lui, la veille systeme
  # eteint l'ecran en pleine tournee et le livreur doit le reveiller a
  # chaque coup d'oeil. Active a l'ouverture de l'ecran, relache au
  # dispose. Audit 2026-06-11.
  wakelock_plus: ^1.2.8
  # light : lecture du capteur de luminosite ambiante (Android only) pour
  # le mode jour/nuit auto (carte Trello #95). Stream<int> en lux. Si le
  # capteur n'est pas dispo (rare sur Android, jamais sur iOS), le toggle
  # reste OFF et l'utilisateur garde la bascule manuelle. MIT, ~80 KB.
  light: ^4.0.1

# ─────────────────────────────────────────────────────────────────
# Overrides
# ─────────────────────────────────────────────────────────────────
# sqlite3_flutter_libs : drift_flutter 0.3.0 tire la version 0.6.0+eol
# qui est un STUB VIDE (le package a migre vers les "native assets"/hooks
# de sqlite3 3.x). Or les native assets ne sont PAS embarquees dans un
# build APK release en Flutter 3.41 stable -> `libsqlite3.so` absente ->
# crash au boot (`Failed to load dynamic library libsqlite3.so`) -> ecran
# de chargement infini. On force la derniere 0.5.x qui, elle, embarque
# bien la lib native via son script Gradle. drift_flutter n'importe aucun
# symbole de ce package (0.6.0 etant vide), donc aucun conflit de code.
# Cf debug 2026-06-02. A retirer si/quand les native assets Android sont
# stables (et que la .so est verifiee dans l'APK).
dependency_overrides:
  sqlite3_flutter_libs: 0.5.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test : permet de lancer des tests sur device reel
  # (Android/iOS) qui peuvent utiliser les plugins comme
  # google_mlkit_text_recognition. Indispensable pour le harness de
  # batch eval OCR qui boucle sur N images reelles via ML Kit.
  # Tournees via : `flutter test integration_test/<file>.dart -d <device>`.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  # Utilises uniquement par les tests pour mocker path_provider
  # (BackupService et AutoBackupService dependent de
  # getApplicationDocumentsDirectory + getExternalStorageDirectory).
  # Ce sont en fait des dependances transitives de path_provider en
  # runtime, mais on les declare explicitement ici pour pouvoir les
  # importer dans test/backup_service_test.dart.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  # Idem pour mocker Geolocator dans test/data/location_service_test.dart
  # (GeolocatorPlatform.instance = mock). Dependance transitive de
  # geolocator declaree explicitement pour pouvoir l'importer.
  geolocator_platform_interface: ^4.2.6
  # fake_async : horloge virtuelle pour tester les timeouts/Timer sans
  # attente reelle (route_service_test : timeout interne de 15s). Deja
  # tiree transitivement par flutter_test, declaree ici pour l'importer
  # sans warning depend_on_referenced_packages.
  fake_async: ^1.3.0
  msix: ^3.16.13

# App icon : pin lime + trace de route sur fond ink, designee via
# Claude Design. Sources d'origine versionnees dans
# `assets/branding/source/` (SVG + PNG aux differentes tailles).
# `icon_source.png` et `icon_foreground.png` = copie du PNG 1024 ;
# le double-mask Android adaptive est OK car les coins arrondis du
# design tombent dans la zone safe.
# Ne cible que Android pour l'instant -- iOS sera ajoute le jour ou
# on publiera sur l'App Store.
# Regenerer apres modification : `flutter pub run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/icon_source.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E1410"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

# Splash screen : icone Claude Design (carte ink avec pin + route lime)
# centree sur fond cream. Le rendu Android < 12 utilise `image`
# directement, Android 12+ utilise la section `android_12` (icone plus
# petite imposee par l'API native).
# Regenerer apres modification : `flutter pub run flutter_native_splash:create`.
flutter_native_splash:
  color: "#F5F3EE"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#F5F3EE"
    image: assets/branding/splash_logo.png
    icon_background_color: "#F5F3EE"
  fullscreen: false
  android: true
  ios: false
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Fonts bundled localement : permet a `google_fonts` d'utiliser les
  # versions embarquees au lieu de fetcher en HTTP. Indispensable
  # pour : (1) marcher hors-ligne sans depender de fonts.gstatic.com,
  # (2) faire passer les widget_smoke_test (HTTP bloque par
  # TestWidgetsFlutterBinding). Le nom de fichier doit matcher la
  # convention Google Fonts : `<Family>-<Weight>.ttf`.
  # Total : ~350 KB d'APK.
  assets:
    - assets/fonts/
    # Fixtures pour le harness de batch eval OCR (integration_test).
    # Bordereaux scannes par Noah, bundles dans l'APK debug pour
    # contourner les restrictions scoped storage Android 16.
    # **ATTENTION** : ~24 MB d'images, a NE PAS inclure dans le build
    # release Play Store. Le script scripts/build-and-install.ps1
    # retire automatiquement cette ligne le temps du build release
    # (pubspec.yaml.release-bak) puis la restaure. Pour un build
    # release manuel : retirer la ligne ci-dessous avant `flutter
    # build apk --release`, puis la remettre.
    - assets/test_bordereaux/
    # Modeles ML embarques (Random Forest ONNX) pour classer les lignes
    # OCR des bordereaux en NOM_CLIENT/RUE/CP_VILLE/TEL/REF/PARASITE.
    # Genere par tools/train_classifier.py + features.json pour
    # reproduire les features cote Dart.
    - assets/ml/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Configuration de l'installeur Windows MSIX (carte #88·5).
# Build : flutter build windows --release --dart-define-from-file=cloud.env.json
# puis : dart run msix:create
# (certificat de test auto-genere ; pour distribuer, voir le .bat d'install
#  du certificat genere a cote du .msix).
msix_config:
  display_name: opti_route (chef)
  publisher_display_name: CALOTE Noah
  identity_name: com.calote.optiroute
  msix_version: 2.9.3.0
  capabilities: internetClient, location
  install_certificate: false
  # msix:create relance sinon `flutter build windows` SANS nos
  # --dart-define-from-file (credentials cloud) -> build local-only.
  # On builde nous-memes avec les defines AVANT, puis msix empaquette
  # ce build existant sans le refaire. Cf bug terrain 2026-06-01 (PC
  # ne se connectait pas au cloud).
  build_windows: false
